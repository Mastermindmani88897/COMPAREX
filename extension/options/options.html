<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMPAREX Extension Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <header class="options-header">
      <div class="brand">
        <span class="logo">⚡</span>
        <h1>COMPAREX Extension Settings</h1>
      </div>
      <p class="subtitle">Customize your real-time price comparison widget and marketplace connectors.</p>
    </header>

    <main class="options-body">
      <!-- General Preferences -->
      <section class="section">
        <h2>General Preferences</h2>
        
        <div class="form-group">
          <label for="theme-select">Extension Theme</label>
          <select id="theme-select">
            <option value="dark">Dark Mode (Recommended)</option>
            <option value="light">Light Mode</option>
            <option value="system">System Default</option>
          </select>
        </div>

        <div class="form-group">
          <label for="overlay-position">Floating Overlay Position</label>
          <select id="overlay-position">
            <option value="bottom-right">Bottom Right (Default)</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="top-right">Top Right</option>
          </select>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="enable-overlay" checked>
            Enable floating price comparison widget on product pages
          </label>
        </div>
      </section>

      <!-- Marketplace Toggles -->
      <section class="section">
        <h2>Marketplace Connector Toggles</h2>
        <p class="section-desc">Enable or disable price queries for specific stores:</p>

        <div class="marketplace-grid" id="marketplace-grid">
          <!-- Dynamically populated -->
        </div>
      </section>

      <!-- Developer & Debug -->
      <section class="section">
        <h2>Developer & Storage</h2>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="debug-mode">
            Enable verbose extension debug logging
          </label>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="clear-cache-btn">Clear Extension Cache</button>
        </div>
      </section>

      <div class="save-bar">
        <button class="btn btn-primary" id="save-btn">Save Settings</button>
        <span id="save-msg" class="save-msg"></span>
      </div>
    </main>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="../storage/extension_storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
