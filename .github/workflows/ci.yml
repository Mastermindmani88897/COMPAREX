name: COMPAREX CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Frontend CI ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend – Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # ── Backend Lint (no DB required, fast) ──────────────────────
  backend-lint:
    name: Backend – Flake8 Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8 lint check
        run: flake8 app/

  # ── Backend Integration Tests (real isolated PostgreSQL) ──────
  backend-test:
    name: Backend – Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comparex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comparex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only isolated database — NOT the production Neon/Render database
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/comparex_test"
      ENVIRONMENT: development
      DEBUG: "True"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      LOG_LEVEL: "WARNING"
      # AI provider set to mock in CI — no real Gemini key required
      AI_PROVIDER: mock
      # Marketplace providers stubbed — no production API keys exposed
      SERPAPI_API_KEY: ""
      RAINFOREST_API_KEY: ""
      BRIGHTDATA_API_KEY: ""
      ZENROWS_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify application imports
        run: python -c "from app.main import app; print('FastAPI app import OK')"

      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d comparex_test; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... attempt $i/30"
            sleep 2
          done

      - name: Verify database connectivity
        run: |
          python -c "
import psycopg2, sys
try:
    conn = psycopg2.connect(
        host='localhost', port=5432, user='postgres',
        password='postgres', dbname='comparex_test'
    )
    conn.close()
    print('psycopg2 connectivity OK')
except Exception as e:
    print(f'psycopg2 connectivity FAILED: {e}', file=sys.stderr)
    sys.exit(1)
"

      - name: Run Alembic migrations against CI database
        run: |
          python -c "
import sys, os
sys.path.insert(0, '.')
os.environ['DATABASE_URL'] = 'postgresql+asyncpg://postgres:postgres@localhost:5432/comparex_test'
from alembic.config import Config
from alembic import command
cfg = Config('alembic.ini')
# Use psycopg2 sync driver for CLI migration
cfg.set_main_option(
    'sqlalchemy.url',
    'postgresql+psycopg2://postgres:postgres@localhost:5432/comparex_test'
)
try:
    command.upgrade(cfg, 'head')
    print('Alembic upgrade head: OK')
except Exception as e:
    print(f'Alembic upgrade head FAILED: {e}', file=sys.stderr)
    import traceback; traceback.print_exc()
    sys.exit(1)
"

      - name: Verify migration state
        run: |
          python -c "
import sys, os
sys.path.insert(0, '.')
from alembic.config import Config
from alembic import command
cfg = Config('alembic.ini')
cfg.set_main_option(
    'sqlalchemy.url',
    'postgresql+psycopg2://postgres:postgres@localhost:5432/comparex_test'
)
command.current(cfg)
command.heads(cfg)
print('Migration state: OK')
"

      - name: Run targeted AI endpoint tests
        run: |
          pytest tests/test_phase6.py::test_ai_chat_endpoint -q
          pytest tests/test_phase6.py::test_ai_recommendations_endpoint -q

      - name: Run full backend test suite
        run: pytest -q
